name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    # workflow_run fires on failure too, so this is the gate.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            context: services/api
            dockerfile: services/api/Dockerfile
          - name: web
            context: .
            dockerfile: apps/studio/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/alidade-${{ matrix.name }}
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_sha || github.sha }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          # Add linux/arm64 if the host is ARM. Check with `uname -m`.
          platforms: linux/amd64

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          envs: TAG
          script: |
            set -euo pipefail
            cd /opt/alidade

            if grep -q '^TAG=' .env; then
              sed -i "s|^TAG=.*|TAG=${TAG}|" .env
            else
              echo "TAG=${TAG}" >> .env
            fi

            docker compose --env-file .env -f docker-compose.prod.yml pull
            docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans

            for i in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' alidade-api-1 2>/dev/null || echo starting)
              [ "$status" = "healthy" ] && break
              sleep 4
            done
            [ "$status" = "healthy" ] || { docker compose -f docker-compose.prod.yml logs --tail=80 api; exit 1; }

            docker image prune -af --filter "until=168h"
        env:
          TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
