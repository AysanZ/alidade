map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

proxy_cache_path /var/cache/nginx/tiles
                 levels=1:2
                 keys_zone=tiles:16m
                 max_size=1g
                 inactive=7d
                 use_temp_path=off;

limit_req_zone  $binary_remote_addr zone=tiles_rl:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=api_rl:10m   rate=10r/s;
limit_req_zone  $binary_remote_addr zone=write_rl:1m  rate=6r/m;
limit_conn_zone $binary_remote_addr zone=live_conn:1m;

limit_req_status  429;
limit_conn_status 429;

upstream api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Caddy is the only client, so rate limits can key on the real address.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 12m;
    server_tokens off;

    # Caddy compresses on the outward hop.
    gzip off;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location ~ ^/api/tiles/ {
        limit_req zone=tiles_rl burst=60 nodelay;

        proxy_cache            tiles;
        proxy_cache_valid      200 7d;
        proxy_cache_valid      204 404 1m;
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503;
        proxy_cache_lock       on;
        proxy_cache_lock_timeout 10s;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # WebSocket. Without the upgrade headers nginx returns 200 and the socket closes.
    location ~ ^/api/live/ {
        limit_conn live_conn 3;

        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /api/layers/upload {
        limit_req zone=write_rl burst=2 nodelay;
        client_max_body_size 12m;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /api/layers/from-url {
        limit_req zone=write_rl burst=2 nodelay;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Exact match: GET /api/models/<file> falls through to /api/ below.
    location = /api/models {
        limit_req zone=write_rl burst=2 nodelay;
        client_max_body_size 12m;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=api_rl burst=20 nodelay;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Vite emits content-hashed filenames here.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Points at the hashed bundles, so it must never be cached.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
