# deploy/nginx/default.conf
#
# This runs INSIDE the web image, behind Caddy. Caddy terminates TLS and does
# the compression; everything here is about the internal hop: caching tiles so
# PostGIS is not asked to rebuild a tile nobody changed, and refusing the three
# request shapes that can flatten a two-core box.

# `Connection: upgrade` for a request that asked to upgrade, and `close`
# otherwise. Sending `upgrade` unconditionally breaks keep-alive for every
# ordinary API call sharing this location.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Tiles on disk, not in tmpfs. tmpfs is RAM, and on a 2 GB box a gigabyte of
# tile cache in RAM is the whole problem it was meant to solve.
proxy_cache_path /var/cache/nginx/tiles
                 levels=1:2
                 keys_zone=tiles:16m
                 max_size=1g
                 inactive=7d
                 use_temp_path=off;

# Three separate budgets, because the three routes cost wildly different
# amounts. A tile is cheap and bursty; an upload runs ogr2ogr; a WebSocket
# spawns a simulator task holding sixty vehicles at 1 Hz for as long as it is
# open — that last one is the only route here where a single client can pin a
# core, so it is capped by connection rather than by rate.
limit_req_zone  $binary_remote_addr zone=tiles_rl:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=api_rl:10m   rate=10r/s;
limit_req_zone  $binary_remote_addr zone=write_rl:1m  rate=6r/m;
limit_conn_zone $binary_remote_addr zone=live_conn:1m;

limit_req_status  429;
limit_conn_status 429;

upstream api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Caddy is the only thing that talks to this container, so the forwarded
    # address can be trusted. Without this every rate limit above would be
    # keyed on the Docker bridge address — one bucket shared by the internet.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # A global ceiling. The per-route limits below are tighter where it matters.
    client_max_body_size 12m;

    server_tokens off;

    # Compression is Caddy's job on the outward hop; doing it again here would
    # be CPU spent to hand Caddy something it has to leave alone.
    gzip off;

    # For the container healthcheck. Never reaches the API.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------- tiles
    # The expensive route and the cacheable one. ST_AsMVT is CPU-bound, and on
    # two cores a pan across a city is twenty of them at once. Cached for a
    # week: the geometry behind a tile only changes when a layer is replaced.
    location ~ ^/api/tiles/ {
        limit_req zone=tiles_rl burst=60 nodelay;

        proxy_cache            tiles;
        proxy_cache_valid      200 7d;
        proxy_cache_valid      204 404 1m;
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503;
        # One request rebuilds a missing tile; the rest wait for it instead of
        # each starting their own copy of the same query.
        proxy_cache_lock       on;
        proxy_cache_lock_timeout 10s;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ----------------------------------------------------------- live feed
    # A WebSocket is an HTTP request that asks to stop being one. Nginx proxies
    # HTTP/1.0 by default and strips hop-by-hop headers, so without the three
    # lines below the upgrade never arrives: the browser gets a 200, the socket
    # closes, and the studio spends the afternoon retrying a feed that works.
    location ~ ^/api/live/ {
        limit_conn live_conn 3;

        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # A feed that is quiet is not a feed that is dead. The default read
        # timeout of 60s would cut a working connection every minute on a
        # fleet that reports rarely.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # -------------------------------------------------------------- writes
    # Ingest and model upload. Both spend real time on disk and in a
    # subprocess, so they get their own budget and their own body limit.
    location = /api/layers/upload {
        limit_req zone=write_rl burst=2 nodelay;
        client_max_body_size 12m;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /api/layers/from-url {
        limit_req zone=write_rl burst=2 nodelay;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Exact match, so it catches the POST that uploads a model and the GET that
    # lists them, while GET /api/models/<file>.glb falls through to /api/ below
    # and is served with the immutable cache header the API already sets.
    location = /api/models {
        limit_req zone=write_rl burst=2 nodelay;
        client_max_body_size 12m;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # ------------------------------------------------------ everything else
    location /api/ {
        limit_req zone=api_rl burst=20 nodelay;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # --------------------------------------------------------------- static
    # Vite emits content-hashed filenames into /assets/, so a year is safe and
    # `immutable` stops the browser revalidating on every reload.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # The one file that must never be cached, because it is what points at the
    # hashed bundles. Cache this and a deployment is invisible until someone
    # hard-refreshes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
