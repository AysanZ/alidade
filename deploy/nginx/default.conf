# Write guard, and its own off switch.
#
# A write method must carry the token. Leave ALIDADE_WRITE_TOKEN empty and the
# empty header every request has matches it, so every write is allowed: an open
# instance and a locked one are the same config and one environment variable.
#
# Applied per location rather than at server level, because a server-level `if`
# runs before a location is chosen and nothing could then opt out of it.
# NGINX_ENVSUBST_FILTER keeps substitution to ALIDADE_* so $host survives.
map $http_x_alidade_write $token_ok {
    default 0;
    "${ALIDADE_WRITE_TOKEN}" 1;
}

map $request_method $method_writes {
    default 0;
    POST    1;
    PUT     1;
    PATCH   1;
    DELETE  1;
}

map "$method_writes$token_ok" $deny_write {
    default 0;
    "10"    1;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

proxy_cache_path /var/cache/nginx/tiles
                 levels=1:2
                 keys_zone=tiles:16m
                 max_size=1g
                 inactive=7d
                 use_temp_path=off;

limit_req_zone  $binary_remote_addr zone=tiles_rl:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=api_rl:10m   rate=10r/s;
limit_req_zone  $binary_remote_addr zone=write_rl:1m  rate=6r/m;
limit_conn_zone $binary_remote_addr zone=live_conn:1m;

limit_req_status  429;
limit_conn_status 429;

upstream api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Caddy is the only client, so rate limits can key on the real address.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 12m;
    server_tokens off;

    # Caddy compresses on the outward hop.
    gzip off;

    # nginx refuses a body or a rate before the API ever sees the request, and
    # answers in HTML. The studio reads JSON, so it fell back to "the server
    # answered 413" — a limit somebody set on purpose, reported as a fault.
    error_page 413 = @too_large;
    error_page 429 = @too_fast;

    location @too_large {
        default_type application/json;
        return 413 '{"detail":"That file is larger than this server accepts. Try a smaller one, or run Alidade yourself, where the limit is yours to set."}';
    }

    location @too_fast {
        default_type application/json;
        return 429 '{"detail":"That is more uploads than this server allows in a minute. Wait a moment and try again."}';
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Imagery tiles are rendered from a COG on demand, which is more expensive
    # than ST_AsMVT and just as cacheable. Matched before /api/ so the general
    # rate limit does not apply: one screen of imagery is thirty tiles.
    location ~ ^/api/rasters/tiles/ {
        limit_req zone=tiles_rl burst=60 nodelay;

        proxy_cache            tiles;
        proxy_cache_valid      200 7d;
        # A 204 is a tile outside every footprint, which is a fact about the
        # catalogue rather than an error — but it changes the moment somebody
        # uploads, so it is cached briefly and not for a week.
        proxy_cache_valid      204 404 1m;
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503;
        proxy_cache_lock       on;
        proxy_cache_lock_timeout 10s;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Uploading imagery. Exact match, so GET /api/rasters/<id> falls through.
    #
    # Two limits here were silently wrong for imagery. The 12 MB body is right
    # for a .glb and refuses a satellite scene outright — nginx rejects the body
    # itself, so the API never sees the request and nothing in any log says which
    # limit was hit. And gdalwarp on a gigabyte takes minutes, which the 300s
    # used elsewhere would cut in half.
    location = /api/rasters {
        if ($deny_write) { return 403; }
        limit_req zone=write_rl burst=2 nodelay;
        # 8 GB is what the format allows, not what a 50 GB disk survives. Set
        # this and MAX_RASTER_MB to what you are willing to lose.
        client_max_body_size ${ALIDADE_RASTER_BODY};
        # Passing a gigabyte along beats spooling it to a disk buffer, and the
        # buffer is what fills /var on this container.
        proxy_request_buffering off;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location ~ ^/api/tiles/ {
        limit_req zone=tiles_rl burst=60 nodelay;

        proxy_cache            tiles;
        proxy_cache_valid      200 7d;
        proxy_cache_valid      204 404 1m;
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503;
        proxy_cache_lock       on;
        proxy_cache_lock_timeout 10s;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # WebSocket. Without the upgrade headers nginx returns 200 and the socket closes.
    location ~ ^/api/live/ {
        limit_conn live_conn 3;

        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /api/layers/upload {
        if ($deny_write) { return 403; }
        limit_req zone=write_rl burst=2 nodelay;
        # A little above MAX_UPLOAD_MB, so a file that is only somewhat too big
        # reaches the API and gets told its own size and the limit, rather than
        # being refused here by a number nobody can see.
        client_max_body_size ${ALIDADE_UPLOAD_BODY};
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # The reason the SSRF check in app/net.py exists.
    location = /api/layers/from-url {
        if ($deny_write) { return 403; }
        limit_req zone=write_rl burst=2 nodelay;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Exact match: GET /api/models/<file> falls through to /api/ below.
    location = /api/models {
        if ($deny_write) { return 403; }
        limit_req zone=write_rl burst=2 nodelay;
        client_max_body_size 12m;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location /api/ {
        # Everything else, DELETE and PATCH included.
        if ($deny_write) { return 403; }
        limit_req zone=api_rl burst=20 nodelay;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Vite emits content-hashed filenames here.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Points at the hashed bundles, so it must never be cached.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
