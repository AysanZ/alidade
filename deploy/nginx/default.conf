# `Connection: upgrade` for a request that asked to upgrade, and `close`
# otherwise. Sending `upgrade` unconditionally breaks keep-alive for every
# ordinary API call sharing this location.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A model upload is a file, and the default 1 MB body limit is not one.
        client_max_body_size 256m;

        # The live feed is a WebSocket, and a WebSocket is an HTTP request that
        # asks to stop being one. Nginx proxies HTTP/1.0 by default and strips
        # hop-by-hop headers, so without these three lines the upgrade never
        # reaches the API: the browser gets a 200, the socket closes, and the
        # studio spends the afternoon retrying a feed that is working.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A feed that is quiet is not a feed that is dead. The default read
        # timeout is 60 seconds, which would cut a working connection every
        # minute on a fleet that reports rarely.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
