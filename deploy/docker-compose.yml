name: alidade

services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alidade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-alidade}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../data/init:/docker-entrypoint-initdb.d:ro
    ports:
      # 5432 is usually taken by a local postgres, so the host side is 5433.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alidade} -d ${POSTGRES_DB:-alidade}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../services/api
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alidade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-alidade}
      POSTGRES_HOST: postgis
      POSTGRES_PORT: 5432
      TILE_CACHE_SECONDS: ${TILE_CACHE_SECONDS:-300}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MODELS_DIR: /srv/models
    volumes:
      # Uploaded 3D models. Files, not rows, so they get a volume of their own.
      - models:/srv/models
    depends_on:
      postgis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../apps/studio/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    ports:
      # 8080 is usually taken by something else already.
      - "${NGINX_PORT:-8088}:80"

volumes:
  pgdata:
  models:
