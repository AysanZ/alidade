# Production. Images are built in CI and pulled by tag; the server never builds.
#   docker compose --env-file .env -f docker-compose.prod.yml up -d
# Only Caddy publishes ports.

name: alidade

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./portfolio:/srv/portfolio:ro
      - caddy_data:/data          # certificates
      - caddy_config:/config
    networks: [edge]
    mem_limit: 192m
    logging: *logging

  web:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .env}/alidade-web:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - tile_cache:/var/cache/nginx
    networks: [edge, backend]
    mem_limit: 192m
    logging: *logging

  api:
    image: ghcr.io/${GHCR_OWNER}/alidade-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alidade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-alidade}
      POSTGRES_HOST: postgis
      POSTGRES_PORT: 5432
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
      TILE_CACHE_SECONDS: ${TILE_CACHE_SECONDS:-604800}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      MODELS_DIR: /srv/models
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      LIVE_FLEET_SIZE: ${LIVE_FLEET_SIZE:-60}
      LIVE_CENTRE_LON: ${LIVE_CENTRE_LON:-51.39}
      LIVE_CENTRE_LAT: ${LIVE_CENTRE_LAT:-35.69}
      LIVE_INTERVAL_SECONDS: ${LIVE_INTERVAL_SECONDS:-1.0}
    volumes:
      - models:/srv/models
    depends_on:
      postgis:
        condition: service_healthy
    networks: [backend]
    # Caps ogr2ogr on a large upload so it dies alone rather than taking Postgres.
    mem_limit: 768m
    healthcheck:
      # No curl or wget in python:3.12-slim.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging: *logging

  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alidade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-alidade}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    # No ports. Reachable on the backend network only.
    networks: [backend]
    shm_size: 128mb
    # Tuned for 2 GB and 2 cores.
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=20
      - -c
      - effective_cache_size=768MB
      - -c
      - random_page_cost=1.1
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_wal_size=512MB
      - -c
      - min_wal_size=128MB
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alidade} -d ${POSTGRES_DB:-alidade}"]
      interval: 10s
      timeout: 3s
      retries: 20
    logging: *logging

networks:
  edge:
    name: edge
  # Not internal: ingest from a URL and WMS GetCapabilities need egress.
  backend:

volumes:
  pgdata:
  models:
  tile_cache:
  caddy_data:
  caddy_config:
